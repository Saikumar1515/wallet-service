version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: wallet-postgres

    environment:
      POSTGRES_DB: walletdb
      POSTGRES_USER: walletuser
      POSTGRES_PASSWORD: walletpass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletuser -d walletdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  wallet-app:
    build: .
    container_name: wallet-app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/walletdb
      DB_USERNAME: walletuser
      DB_PASSWORD: walletpass

    ports:
      - "8080:8080"

volumes:
  postgres_data: