databaseChangeLog:
  - changeSet:
      id: insert-wallet
      author: sai

      changes:
        - insert:
            tableName: wallets
            columns:
              - column:
                  name: id
                  value: "11111111-1111-1111-1111-111111111111"

              - column:
                  name: balance
                  valueNumeric: 10000.00

              - column:
                  name: created_at
                  valueDate: CURRENT_TIMESTAMP

              - column:
                  name: updated_at
                  valueDate: CURRENT_TIMESTAMP